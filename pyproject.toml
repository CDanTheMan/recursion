[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recursion"
version = "0.2.0"
description = "Provider-neutral agent harness"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
recursion = "scripts.v3.harness.cli:main"

[tool.setuptools]
packages = [
    "scripts",
    "scripts.v3",
    "scripts.v3.harness",
    "scripts.v3.planning",
    "scripts.v3.proc",
    "scripts.v3.planning.replay",
    "scripts.v3.planning.validation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
parallel = true
branch = true
source = ["tests", "tools", "schemas", "scripts"]
omit = [
    "tools/check_next_phase.py",
    "tools/check_public_scope.py",
    "tools/check_rescope.py",
]
data_file = "tests/.coverage"

[tool.coverage.report]
skip_empty = true
show_missing = false
