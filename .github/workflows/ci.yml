name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point master at origin/master
        run: |
          git fetch origin master:refs/remotes/origin/master
          git update-ref refs/heads/master refs/remotes/origin/master

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Working tree is clean
        run: test -z "$(git status --porcelain)"

      - name: Orientation contracts
        run: python -X utf8 -B tools/check_v3_orientation.py --contracts

      - name: Scope tests
        run: python -X utf8 -B tools/test_check_v3_orientation_scope.py

      - name: Pytest suites
        run: |
          set -euo pipefail
          suites=$(git grep -l -e 'import pytest' -e 'from pytest' -- '*.py' || true)
          if [ -z "$suites" ]; then
            echo "No pytest suites in the tree."
            exit 0
          fi
          echo "$suites"
          python -X utf8 -B -m pytest -q --cov --cov-report=term $suites
